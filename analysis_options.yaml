# Lints for the Pooja Pasal app: flutter_lints plus the analyzer's strict
# type checks and a set of rules that catch real bugs (unawaited futures,
# dynamic calls, leaked subscriptions) or keep the code consistent.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_redundant_argument_values
    - avoid_unnecessary_containers
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - sized_box_for_whitespace
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_colored_box
    - use_decorated_box
    - use_super_parameters
